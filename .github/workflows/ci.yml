# -----------------------------------------------------------------------------
# CI/CD — Librăria bookstore
#
# This workflow runs in GitHub Actions every time you push code or open a PR.
# Read the comments to understand each step — this is the "pipeline".
#
# You can see the runs here:  https://github.com/<you>/BookStore/actions
# -----------------------------------------------------------------------------

name: CI / CD

# "on" = WHEN the pipeline runs.
on:
  push:                 # on every push ...
    branches: [main]    #   ... to the main branch
  pull_request:         # and on every pull request (any branch into main)
    branches: [main]
  workflow_dispatch:    # also allow manual runs from the Actions tab

# A workflow is made of "jobs". Each job runs in its own fresh VM.
jobs:
  # --- Job 1: build + verify the frontend -----------------------------------
  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4           # step 1: copy your code into the VM

      - uses: actions/setup-node@v4         # step 2: install Node.js
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci                         # 'npm ci' = clean install from lockfile

      - name: Type-check (tsc)
        run: npx tsc --noEmit               # fail if there are TypeScript errors

      - name: Production build (vite)
        run: npx vite build                 # fail if the app can't build

      # Optional: upload the built files as a downloadable artifact.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/

  # --- Job 2: build the backend ---------------------------------------------
  backend:
    name: Backend (install + syntax check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Syntax check server
        run: node --check src/server.js      # fail if there is a syntax error

  # --- Job 3: build the Docker images ---------------------------------------
  # This proves your Dockerfiles work on a clean machine. It runs only after
  # the two jobs above pass (the 'needs' line).
  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [frontend, backend]               # wait for the two above to pass
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        run: |
          docker compose build

# -----------------------------------------------------------------------------
# NOTE: This is the "CI" (Continuous Integration) half — it verifies the code.
# The "CD" (Continuous Deployment) half would actually SHIP your app. To do
# that after these green checks, you would add a step that pushes the images
# to Docker Hub (docker/login-action + docker/build-push-action) and tells a
# server to pull them. Keep this CI first; add CD once you have a host.
# -----------------------------------------------------------------------------
