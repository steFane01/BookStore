# -----------------------------------------------------------------------------
# CI — Librăria bookstore
#
# Runs on every push / pull request to `main` and can be started manually from
# the Actions tab. The pipeline has two kinds of stages:
#
#   1. CODE CHECKS
#        - frontend: install, TypeScript type-check, production build
#        - backend:  install, syntax check of every file, unit tests
#   2. IMAGE BUILDS
#        - both Dockerfiles are built on a clean runner (same contexts as the
#          deploy), so a broken Dockerfile fails before it reaches the server.
#
# Runners are pinned to `ubuntu-24.04` on purpose: GitHub is migrating the
# `ubuntu-latest` label to Ubuntu 26 (runner-images#14748, starting Oct 2026).
# A fixed image keeps the pipeline reproducible until Ubuntu 26 is validated.
# -----------------------------------------------------------------------------

name: CI / CD

on:
  push:                 # on every push ...
    branches: [main]    #   ... to the main branch
  pull_request:         # and on every pull request (any branch into main)
    branches: [main]
  workflow_dispatch:    # also allow manual runs from the Actions tab

permissions:
  contents: read

# A newer push cancels an older run of the same branch (saves CI minutes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Stage 1a: code checks — frontend --------------------------------------
  frontend:
    name: Check frontend (type-check + build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc)
        run: npm run typecheck

      - name: Production build (vite)
        run: npm run build

      # Optional: download the built site from the run page.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  # --- Stage 1b: code checks — backend ---------------------------------------
  backend:
    name: Check backend (syntax + unit tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check every source file
        run: |
          set -euo pipefail
          find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Unit tests
        run: npm test

  # --- Stage 2: build the Docker images --------------------------------------
  # Runs only after both check jobs pass. Buildx + GitHub Actions cache keeps
  # repeated runs fast; nothing is pushed (there is no registry configured).
  docker:
    name: Build Docker images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config -q

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: libraria-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: false
          tags: libraria-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

# -----------------------------------------------------------------------------
# This is the CI half — it verifies code + images. The deploy workflow
# (deploy.yml) runs after this one finishes successfully on `main`.
# -----------------------------------------------------------------------------
